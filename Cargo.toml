[package]
name = "mdv"
version = "4.2.1"
edition = "2024"
authors = ["WhoSowSee"]
description = "Terminal Markdown Viewer"
license = "MIT"
repository = "https://github.com/WhoSowSee/mdv"
keywords = ["markdown", "terminal", "viewer", "cli"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.89.0"

exclude = [
    "docs/images",
	".github",
	"snap"
]

[[bin]]
name = "mdv"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.49", features = ["derive", "color"] }
pulldown-cmark = { version = "0.13.0", features = ["simd"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
syntect = "5.3.0"
crossterm = "0.29.0"
jiff = "0.2"
anyhow = "1.0.100"
thiserror = "2.0.17"
regex = "1.12.2"
dirs = "6.0.0"
notify = "8.2.0"
unicode-width = "0.2.2"
log = "0.4.28"
env_logger = "0.11.8"
comfy-table = { version = "7.2.1", features = ["custom_styling"] }
minus = { version = "5.7.2", features = ["dynamic_output", "search"] }
arboard = { version = "3.6.1", default-features = false }
scraper = "0.27.0"
ego-tree = "0.11.0"
ignore = "0.4"
fuzzy-matcher = "0.3"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
winsplit = "0.1.0"

[target.'cfg(not(windows))'.dependencies]
shell-words = "1.1.1"
libc = "0.2"

[dev-dependencies]
tempfile = "3.23.0"
assert_cmd = "2.0.17"
predicates = "3.1.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
minus = { path = "vendor/minus" }
