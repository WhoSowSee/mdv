name: Build platform binaries

on:
  workflow_call:

env:
  PROJECT_NAME: mdv

permissions:
  contents: read

jobs:
  linux:
    name: Linux target ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            builder: cargo
            deb_variant: glibc-2-39
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            builder: cross
            deb_variant: musl
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cargo
            deb_variant: glibc-2-39
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            builder: cross
            deb_variant: musl
          - target: i686-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cross
            deb_variant: glibc-2-18
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cross
            deb_variant: glibc-2-27
          - target: sparc64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cross
            deb_variant: glibc-2-18

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5
          fallback: none

      - name: Build native release binary
        if: matrix.builder == 'cargo'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build cross-compiled release binary
        if: matrix.builder == 'cross'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Test native binary
        if: matrix.builder == 'cargo'
        run: |
          cargo test --locked --target ${{ matrix.target }}
          "target/${{ matrix.target }}/release/${PROJECT_NAME}" --version

      - name: Package zip
        run: |
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/${PROJECT_NAME}"
          if [ ! -f "$binary" ]; then
            echo "::error::Binary artifact not found: $binary" >&2
            exit 1
          fi
          zip -j "artifacts/${PROJECT_NAME}-${{ matrix.target }}.zip" "$binary"

      - name: Install cargo-deb
        if: runner.arch != 'ARM64'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
          fallback: none

      - name: Install cargo-deb on ARM64
        if: runner.arch == 'ARM64'
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Build deb package
        run: >-
          cargo deb --locked --no-build --variant ${{ matrix.deb_variant }}
          --target ${{ matrix.target }} --output "artifacts/${PROJECT_NAME}-${{ matrix.target }}.deb"

      - name: Verify deb package
        run: python3 .github/scripts/verify_deb.py "${{ matrix.target }}" "artifacts/${PROJECT_NAME}-${{ matrix.target }}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mdv-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS target ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            arch: x86_64

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test and verify binary
        run: |
          cargo test --locked --target ${{ matrix.target }}
          lipo "target/${{ matrix.target }}/release/${PROJECT_NAME}" -verify_arch ${{ matrix.arch }}
          "target/${{ matrix.target }}/release/${PROJECT_NAME}" --version

      - name: Package zip
        run: |
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/${PROJECT_NAME}"
          if [ ! -f "$binary" ]; then
            echo "::error::Binary artifact not found: $binary" >&2
            exit 1
          fi
          zip -j "artifacts/${PROJECT_NAME}-${{ matrix.target }}.zip" "$binary"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdv-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows target ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test and verify binary
        shell: pwsh
        run: |
          cargo test --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "target/${{ matrix.target }}/release/${env:PROJECT_NAME}.exe" --version

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $binary = "target/${{ matrix.target }}/release/${env:PROJECT_NAME}.exe"
          if (-not (Test-Path $binary)) {
            throw "Binary artifact not found: $binary"
          }
          Compress-Archive -Path $binary -DestinationPath ("artifacts/${env:PROJECT_NAME}-${{ matrix.target }}.zip")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdv-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
