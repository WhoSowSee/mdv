name: Build binaries

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  PROJECT_NAME: mdv

permissions:
  contents: read

jobs:
  package:
    name: Verify crates.io package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test Debian package validation
        run: python3 .github/scripts/test_verify_deb.py

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag.removeprefix("v") != version:
              raise SystemExit(f"Tag {tag!r} does not match Cargo version {version!r}")
          PY

      - name: Verify publishable package
        run: cargo publish --dry-run --locked

  linux:
    name: Linux target ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            builder: cargo
            deb_variant: glibc-2-39
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            builder: cross
            deb_variant: musl
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cargo
            deb_variant: glibc-2-39
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            builder: cross
            deb_variant: musl
          - target: i686-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cross
            deb_variant: glibc-2-18
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cross
            deb_variant: glibc-2-27
          - target: sparc64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cross
            deb_variant: glibc-2-18

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5
          fallback: none

      - name: Build native release binary
        if: matrix.builder == 'cargo'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build cross-compiled release binary
        if: matrix.builder == 'cross'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Test native binary
        if: matrix.builder == 'cargo'
        run: |
          cargo test --locked --target ${{ matrix.target }}
          "target/${{ matrix.target }}/release/${PROJECT_NAME}" --version

      - name: Package zip
        run: |
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/${PROJECT_NAME}"
          if [ ! -f "$binary" ]; then
            echo "::error::Binary artifact not found: $binary" >&2
            exit 1
          fi
          zip -j "artifacts/${PROJECT_NAME}-${{ matrix.target }}.zip" "$binary"

      - name: Install cargo-deb
        if: runner.arch != 'ARM64'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
          fallback: none

      - name: Install cargo-deb on ARM64
        if: runner.arch == 'ARM64'
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Build deb package
        run: >-
          cargo deb --locked --no-build --variant ${{ matrix.deb_variant }}
          --target ${{ matrix.target }} --output "artifacts/${PROJECT_NAME}-${{ matrix.target }}.deb"

      - name: Verify deb package
        run: python3 .github/scripts/verify_deb.py "${{ matrix.target }}" "artifacts/${PROJECT_NAME}-${{ matrix.target }}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mdv-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS target ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            arch: x86_64

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test and verify binary
        run: |
          cargo test --locked --target ${{ matrix.target }}
          lipo -verify_arch ${{ matrix.arch }} "target/${{ matrix.target }}/release/${PROJECT_NAME}"
          "target/${{ matrix.target }}/release/${PROJECT_NAME}" --version

      - name: Package zip
        run: |
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/${PROJECT_NAME}"
          if [ ! -f "$binary" ]; then
            echo "::error::Binary artifact not found: $binary" >&2
            exit 1
          fi
          zip -j "artifacts/${PROJECT_NAME}-${{ matrix.target }}.zip" "$binary"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdv-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows target ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test and verify binary
        shell: pwsh
        run: |
          cargo test --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "target/${{ matrix.target }}/release/${env:PROJECT_NAME}.exe" --version

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $binary = "target/${{ matrix.target }}/release/${env:PROJECT_NAME}.exe"
          if (-not (Test-Path $binary)) {
            throw "Binary artifact not found: $binary"
          }
          Compress-Archive -Path $binary -DestinationPath ("artifacts/${env:PROJECT_NAME}-${{ matrix.target }}.zip")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdv-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  snap:
    name: Snap package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install LXD and Snapcraft
        run: |
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd runner
          sudo snap install lxd
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          sudo snap install --channel 9.x/stable --classic snapcraft

      - name: Build snap
        run: sudo -u runner -E snapcraft pack --use-lxd --build-for=${{ matrix.arch }}

      - name: Collect snaps
        run: |
          set -euo pipefail
          mkdir -p artifacts
          snaps=(*_${{ matrix.arch }}.snap)
          test "${#snaps[@]}" -eq 1
          test -f "${snaps[0]}"
          mv "${snaps[0]}" "artifacts/${PROJECT_NAME}-${{ matrix.arch }}.snap"

      - name: Test snap
        run: |
          sudo snap install --dangerous "artifacts/${PROJECT_NAME}-${{ matrix.arch }}.snap"
          snap run "${PROJECT_NAME}" --version

      - name: Upload snaps
        uses: actions/upload-artifact@v7
        with:
          name: mdv-snap-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  nix:
    name: Nix package ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Evaluate flake outputs
        run: nix flake check --no-build --print-build-logs

      - name: Build Nix package
        run: |
          nix build .#packages.${{ matrix.system }}.default --print-build-logs
          ./result/bin/mdv --version

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - package
      - linux
      - macos
      - windows
      - snap
      - nix
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compose release notes
        run: bash .github/scripts/release-notes.sh

      - name: Rename artifacts with version
        run: |
          shopt -s nullglob
          for file in dist/*; do
            base=${file##*/}
            suffix=${base#"${PROJECT_NAME}-"}
            mv "$file" "dist/${PROJECT_NAME}-${GITHUB_REF_NAME}-${suffix}"
          done

      - name: List packaged files
        run: ls -R dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          draft: false
          fail_on_unmatched_files: true
