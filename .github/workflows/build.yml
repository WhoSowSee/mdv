name: Build binaries

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  PROJECT_NAME: mdv

permissions:
  contents: read

jobs:
  package:
    name: Verify crates.io package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test release packaging helpers
        run: |
          python3 .github/scripts/test_verify_deb.py
          python3 .github/scripts/test_release_notes.py

      - name: Verify vendored pager
        run: |
          cargo fmt --manifest-path vendor/minus/Cargo.toml --all -- --check
          cargo clippy --manifest-path vendor/minus/Cargo.toml --lib --features dynamic_output,search -- -D warnings
          cargo test --manifest-path vendor/minus/Cargo.toml --lib --features dynamic_output,search

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag.removeprefix("v") != version:
              raise SystemExit(f"Tag {tag!r} does not match Cargo version {version!r}")
          PY

      - name: Verify publishable package
        run: cargo publish --dry-run --locked

  platforms:
    name: Build platform binaries
    uses: ./.github/workflows/build-platforms.yml

  packages:
    name: Build Snap and Nix packages
    uses: ./.github/workflows/build-packages.yml

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - package
      - platforms
      - packages
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compose release notes
        run: bash .github/scripts/release-notes.sh

      - name: Rename artifacts with version
        run: |
          shopt -s nullglob
          for file in dist/*; do
            base=${file##*/}
            suffix=${base#"${PROJECT_NAME}-"}
            mv "$file" "dist/${PROJECT_NAME}-${GITHUB_REF_NAME}-${suffix}"
          done

      - name: List packaged files
        run: ls -R dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          draft: false
          fail_on_unmatched_files: true
