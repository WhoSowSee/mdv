# Copy this file to:
#   <config_dir>/presets/preset-compact.yaml
#
# Select it with:
#   mdv --preset compact-terminal FILE.md
#
# Explicit CLI options override preset values.

name: compact-terminal
theme: terminal
tab_length: 2
wrap: char
table_wrap: fit
heading_layout: flat
table_smart_indent: true
hide_comments: true
code_guessing: false
code_block_style: simple
callout_style: simple
code_wrap_indent: none
link_style: endtable
link_truncation: tablecut
missing_footnote_style: hide
