# Standalone user theme for mdv — no `extends`.
#
# This file lists every available field of a user theme, so it can be
# used as a reference or as a starting point for a fully custom palette.
# Place it (renamed) under `<config_dir>/themes/`, where the directory is
# resolved the same way as `config.yaml`:
#   - --config-file <DIR>   (highest priority)
#   - $MDV_CONFIG_PATH
#   - ~/.config/mdv/         (default)
#
# After the file is in place it shows up in `mdv --theme-info` and can be
# selected with `--theme custom` (or any other name you put in `name:`).
#
# Color values follow the same syntax as `--custom-theme`:
#   named: red, darkgrey, dark_grey
#   hex:   "#ff5577"
#   rgb:   187,154,247
#   ansi:  ansi(42) or just 42

name: custom
description: Standalone palette with all theme sections.
pager:
  transparent: false
text: white
text_light: grey
line_number:
  number: yellow
  separator: darkgrey
h1: red
h2: green
h3: yellow
h4: blue
h5: magenta
h6: cyan
code:
  text: red
  background: null
math:
  text: '#66ccff'
  border: '#6699cc'
quote: darkgrey
link: blue
emphasis:
  text: yellow
  background: null
strong:
  text: red
  background: null
strikethrough:
  text: darkgrey
  background: null
background: rgb(30,30,46)
error: red
warning: yellow
code_block:
  label: darkgrey
  border: null
callout:
  label: null
  border: null
  palette:
    note: blue
    abstract: yellow
    info: blue
    todo: green
    tip: magenta
    success: green
    question: red
    warning: cyan
    failure: grey
    danger: grey
    bug: grey
    example: yellow
    quote: reset
front_matter:
  title: grey
  key: grey
  value: white
  border: darkgrey
details_border: grey
list:
  ordered: blue
  unordered: green
todo:
  checked: green
  unchecked: yellow
table:
  header: yellow
  border: grey
syntax:
  keyword: red
  string: green
  comment: darkgrey
  number: magenta
  operator: red
  function: green
  variable: white
  type_name: blue
strong_emphasis:
  text: null
  background: null
highlight:
  text: null
  background: ansi(236)
horizontal_rule: null
footnote_separator: null
inline_style:
  emphasis:
    italic: true
  strong:
    bold: true
  strong_emphasis:
    bold: true
    italic: true
  code:
    backticks: true
  strikethrough:
    strikethrough: true
  highlight: {}
